[package]
name = "mail-sync-kit"
description = "Protocol-agnostic mail sync engines: IMAP (QRESYNC/CONDSTORE/IDLE), JMAP, SMTP submission (XOAUTH2), and an outbox queue"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/WyattAu/mail-sync-kit"
keywords = ["email", "imap", "jmap", "smtp", "sync"]
categories = ["email", "network-programming"]
exclude = ["/target"]

[dependencies]
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tokio-util = "0.7"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
webpki-roots = "1"
# IMAP transport: `imap-flow` was renamed upstream to `imap-next`.
imap-next = { version = "0.3", features = ["stream", "starttls", "ext_condstore_qresync", "ext_namespace", "ext_utf8"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport"] }
base64 = "0.22"
chrono = "0.4"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
